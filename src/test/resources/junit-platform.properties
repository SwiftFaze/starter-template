# jqwik configuration for property-based tests (issue #200)
# Cap the default number of tries for CI speed while maintaining good coverage.
# 100 tries provides a good balance between thoroughness and execution time.
jqwik.tries.default=100

# Use a fixed seed for reproducible test runs in CI. If a property fails,
# the exact same seed can be used to reproduce the failure locally.
# The seed itself is arbitrary; any fixed value ensures determinism.
jqwik.seed.initial=42859154278924201
